# Render Blueprint — one web service (the Express server, which serves the built SPA and
# the API) plus a managed Postgres database. Deploy via Render → "New +" → "Blueprint",
# or create the pieces manually using the values below.
#
# After the first deploy, run the schema once from your machine:
#   DATABASE_URL="<external db url>" npm run db:init
databases:
  - name: karma-connect-db
    plan: free
    databaseName: karma_connect
    postgresMajorVersion: "16"

services:
  - type: web
    name: karma-connect
    runtime: node
    plan: free
    # --omit=optional skips playwright: it's only for the local LinkedIn agent in agent/, never
    # for the server, and installing it would add weight to every deploy for nothing.
    buildCommand: npm install --include=dev --omit=optional && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: karma-connect-db
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: ANTHROPIC_API_KEY
        sync: false                  # set in the dashboard (secret)
      - key: NODE_ENV
        value: production

      # ── Karma Leads (the other half of the site, served at /leads) ──
      # Leads keeps its OWN database — the paid karma-db that already holds the
      # lead codes. Nothing is migrated; this service just talks to both.
      # Set it to karma-db's connection string. IMPORTANT: Render's INTERNAL
      # connection string only works from the same region, and karma-db is in
      # virginia — if this service is elsewhere, use the external URL instead.
      - key: LEADS_DATABASE_URL
        sync: false
      # WorkOS AuthKit — Leads' sign-in. WORKOS_REDIRECT_URI must be this
      # service's callback, https://<this-host>/api/auth/callback, and the SAME
      # string must be allowlisted in the WorkOS dashboard (Redirects) or no one
      # can log into Leads.
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true          # seals the kl_session cookie; rotating it just re-logs everyone in
      - key: APIFY_TOKEN
        sync: false                  # admin "Find jobs" button; leave blank to disable job search
      # Set to 0 to unmount Karma Leads without a code change (escape hatch).
      # - key: LEADS_ENABLED
      #   value: "0"

      # Optional lock-down + rate-limit / cache — set in the dashboard as needed:
      # - key: ALLOWED_EMAIL_DOMAIN
      #   sync: false
      # - key: UPSTASH_REDIS_REST_URL
      #   sync: false
      # - key: UPSTASH_REDIS_REST_TOKEN
      #   sync: false
