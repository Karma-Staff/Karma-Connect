name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026; move deliberately
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The API reference is generated from the route declarations. If someone
      # adds a route and does not regenerate, this fails — which is the whole
      # point of generating it. Fix with: node scripts/gen-api-docs.mjs
      - name: API docs are current
        run: node scripts/gen-api-docs.mjs --check
