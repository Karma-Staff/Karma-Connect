name: Daily storm digest

# Knocks on the app so the 7am digest goes out, and so any follow-back
# reminders that fell due overnight get flushed.
#
# WHY THIS EXISTS AT ALL: the Render service is on the free plan, which stops
# the process after about fifteen minutes without a request. At 7am nobody
# has touched the site since the night before, so a setInterval inside the
# app is not running and fires nothing. Something outside has to knock.
# GitHub Actions is free and already has the repo.
#
# TWO TIMES, ONE EMAIL: cron here is UTC and has no idea about daylight
# saving, so 11:00 UTC is 7am Eastern in summer and 6am in winter. Both are
# fired; the server checks the real local hour in DIGEST_TZ and only sends
# at 7, and job_runs (migration 009) means the other one is a no-op even if
# both were to qualify.
#
# SETUP — two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL     https://karma-connect-9s2z.onrender.com
#   CRON_TOKEN  the same value as CRON_TOKEN on the Render service
# Until both are set this workflow reports a notice and stops. It does NOT
# fail: "nobody has configured it yet" is not a broken build, and mailing a
# red failure twice a day for it only teaches people to ignore the alerts
# that matter.
on:
  schedule:
    - cron: "0 11 * * *"   # 7am Eastern while daylight saving is in effect
    - cron: "0 12 * * *"   # 7am Eastern the rest of the year
  workflow_dispatch:        # and a button, for testing it now

jobs:
  knock:
    runs-on: ubuntu-latest
    steps:
      - name: Is it configured?
        id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "::notice title=Digest not configured::Set the APP_URL and CRON_TOKEN repository secrets to switch the 7am digest on. Skipping, not failing."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the digest
        if: steps.cfg.outputs.ready == 'yes'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -u
          code=""
          for i in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 120 \
              -X POST "${APP_URL%/}/api/cron/daily" \
              -H 'Content-Type: application/json' \
              -H "x-cron-token: $CRON_TOKEN" -d '{}' || echo "000")

            [ "$code" = "200" ] && break

            # 401/403 is a wrong token and 404 is a wrong URL. Neither gets
            # better by asking again — say so once and stop, rather than
            # spending two more minutes proving it.
            case "$code" in
              401|403) echo "::error::CRON_TOKEN does not match the value on the Render service."; break ;;
              404)     echo "::error::No /api/cron/daily at $APP_URL — check the APP_URL secret."; break ;;
            esac

            # Anything else is most likely a free instance waking up, which
            # takes about 50 seconds. Worth another go.
            [ "$i" -lt 3 ] && { echo "attempt $i: HTTP ${code} — the instance may be waking; retrying"; sleep 30; }
          done

          echo "HTTP $code"
          [ -s body.txt ] && cat body.txt
          echo
          [ "$code" = "200" ]
