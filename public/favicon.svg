<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2348"/>
      <stop offset="1" stop-color="#1c4a78"/>
    </linearGradient>
    <linearGradient id="kcgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD83A"/>
      <stop offset="1" stop-color="#E7B74B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kcbg)"/>
  <!-- Karma Staff mark, traced 1:1 (bars + stem + filled k wedge), scaled into the tile -->
  <g transform="translate(10 19) scale(0.141)" fill="#ffffff">
    <rect x="0"   y="139" width="49" height="47"/>
    <rect x="56"  y="93"  width="49" height="93"/>
    <rect x="112" y="47"  width="48" height="139"/>
    <rect x="167" y="0"   width="49" height="186"/>
    <path d="M305 66 L216 121 L305 185" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="12"/>
  </g>
  <!-- "Connect": a gold network linking the bar tops and rising into the k -->
  <g transform="translate(10 19) scale(0.141)">
    <polyline points="24.5,139 80.5,93 136,47 191.5,0 305,66" fill="none" stroke="url(#kcgold)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#kcgold)">
      <circle cx="24.5"  cy="139" r="15"/>
      <circle cx="80.5"  cy="93"  r="15"/>
      <circle cx="136"   cy="47"  r="15"/>
      <circle cx="191.5" cy="0"   r="15"/>
      <circle cx="305"   cy="66"  r="15"/>
    </g>
  </g>
</svg>
