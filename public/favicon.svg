<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2348"/>
      <stop offset="1" stop-color="#1c4a78"/>
    </linearGradient>
    <linearGradient id="kcgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD83A"/>
      <stop offset="1" stop-color="#E7B74B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kcbg)"/>
  <!-- Karma Staff mark, traced from the official white logo (bars + stem + open-k chevron) -->
  <g transform="translate(10 18) scale(0.35)" fill="#ffffff">
    <rect x="0"  y="52" width="20" height="21"/>
    <rect x="23" y="34" width="20" height="39"/>
    <rect x="46" y="16" width="20" height="57"/>
    <rect x="69" y="0"  width="20" height="73"/>
    <path d="M121 26 L89 47.5 L121 70" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="12"/>
  </g>
  <!-- "Connect": a gold network linking the bar tops and rising into the k -->
  <g transform="translate(10 18) scale(0.35)">
    <polyline points="10,52 33,34 56,16 79,0 121,26" fill="none" stroke="url(#kcgold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#kcgold)">
      <circle cx="10"  cy="52" r="6"/>
      <circle cx="33"  cy="34" r="6"/>
      <circle cx="56"  cy="16" r="6"/>
      <circle cx="79"  cy="0"  r="6"/>
      <circle cx="121" cy="26" r="6"/>
    </g>
  </g>
</svg>
