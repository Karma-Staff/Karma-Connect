<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2348"/>
      <stop offset="1" stop-color="#1c4a78"/>
    </linearGradient>
    <linearGradient id="kcgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD83A"/>
      <stop offset="1" stop-color="#E7B74B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kcbg)"/>
  <g transform="translate(8 16) scale(0.40)">
    <!-- Karma Staff mark: three ascending bars + a bold k, in white -->
    <g fill="#ffffff">
      <rect x="4"  y="50" width="16" height="26"/>
      <rect x="26" y="36" width="16" height="40"/>
      <rect x="48" y="20" width="16" height="56"/>
      <rect x="68" y="2"  width="16" height="74"/>
    </g>
    <path d="M114 6 L84 39 L114 76" fill="none" stroke="#ffffff" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- "Connect": a gold network linking the bar tops and rising into the k -->
    <polyline points="12,50 34,36 56,20 76,2 114,6" fill="none" stroke="url(#kcgold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#kcgold)">
      <circle cx="12"  cy="50" r="6.5"/>
      <circle cx="34"  cy="36" r="6.5"/>
      <circle cx="56"  cy="20" r="6.5"/>
      <circle cx="76"  cy="2"  r="6.5"/>
      <circle cx="114" cy="6"  r="6.5"/>
    </g>
  </g>
</svg>
