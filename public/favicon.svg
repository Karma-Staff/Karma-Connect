<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2348"/>
      <stop offset="1" stop-color="#1c4a78"/>
    </linearGradient>
    <linearGradient id="kcgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD83A"/>
      <stop offset="1" stop-color="#E7B74B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kcbg)"/>
  <g transform="translate(8 16) scale(0.40)">
    <!-- Karma Staff mark: three ascending bars + a bold k, in white -->
    <g fill="#ffffff">
      <rect x="4"  y="52" width="16" height="24"/>
      <rect x="26" y="38" width="16" height="38"/>
      <rect x="48" y="22" width="16" height="54"/>
      <rect x="68" y="2"  width="16" height="74"/>
    </g>
    <path d="M114 4 L84 39 L114 76" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="10"/>
    <!-- "Connect": a gold network linking the bar tops and rising into the k -->
    <polyline points="12,52 34,38 56,22 76,2 114,4" fill="none" stroke="url(#kcgold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#kcgold)">
      <circle cx="12"  cy="52" r="6.5"/>
      <circle cx="34"  cy="38" r="6.5"/>
      <circle cx="56"  cy="22" r="6.5"/>
      <circle cx="76"  cy="2"  r="6.5"/>
      <circle cx="114" cy="4"  r="6.5"/>
    </g>
  </g>
</svg>
