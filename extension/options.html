<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Karma Connect Dialer — Settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0e1626; color: #e7edf7; }
    .card { max-width: 460px; margin: 40px auto; background: #141f33; border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 24px; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    p { color: #9fb0cc; margin: 0 0 16px; font-size: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14);
      background: #0b1220; color: #fff; font: inherit; }
    button { margin-top: 16px; padding: 10px 18px; border: none; border-radius: 9px; cursor: pointer;
      background: linear-gradient(160deg, #2b6ef2, #1b4fd0); color: #fff; font: inherit; font-weight: 600; }
    .ok { color: #16c784; margin-left: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Karma Connect Dialer</h1>
    <p>The web address of your Karma Connect app. No trailing slash.<br>
       e.g. <code>https://karma-connect.onrender.com</code></p>
    <label for="url">App URL</label>
    <input id="url" type="url" placeholder="https://your-app.onrender.com" autocomplete="off">
    <div><button id="save">Save</button><span id="msg" class="ok"></span></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
