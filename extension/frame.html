<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #0e1626; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <!-- This page is served from the extension (chrome-extension://…), so the
       host site's CSP does not apply to it. It frames the real Karma Connect
       dialer, which permits being framed (frame-ancestors *). -->
  <iframe id="dialer" allow="microphone; autoplay"></iframe>
  <script src="frame.js"></script>
</body>
</html>
